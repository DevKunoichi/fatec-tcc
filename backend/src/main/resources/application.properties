# Servidor HTTP
server.port=8080
server.servlet.context-path=/

# Banco de Dados H2 em Memória (Funciona imediatamente sem instalar PostgreSQL)
spring.datasource.url=jdbc:h2:mem:cinemadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Acesse no navegador: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# CORS - origens permitidas (separadas por virgula). Restringido ao frontend local em dev.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Perfil para PostgreSQL (Ative substituindo a URL abaixo quando o PostgreSQL estiver ativo):
# spring.datasource.url=jdbc:postgresql://localhost:5432/cinemadb
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# OMDb API (The Open Movie Database) - https://www.omdbapi.com/
# Obtenha uma chave gratuita em https://www.omdbapi.com/apikey.aspx
omdb.base-url=https://www.omdbapi.com/
omdb.api-key=${OMDB_API_KEY:}

# Seguranca / JWT (Fase 4)
# Em producao, SEMPRE defina JWT_SECRET (>= 32 chars) e JWT_EXPIRATION (ms).
jwt.secret=${JWT_SECRET:dev-secret-cinemax-trocar-em-producao-2026-32chars}
jwt.expiration=${JWT_EXPIRATION:86400000}
