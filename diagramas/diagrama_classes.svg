<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1040" width="1460" height="1040">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      * { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; box-sizing: border-box; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .card-transition { transition: transform 0.2s ease, filter 0.2s ease; }
      .card-transition:hover { filter: url(#card-hover-shadow); }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.07" />
    </filter>
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F8FAFC" /><stop offset="100%" stop-color="#F1F5F9" /></linearGradient>
    <linearGradient id="header-slate" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0F172A" /><stop offset="100%" stop-color="#334155" /></linearGradient>
    <linearGradient id="grad-catalog" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563EB" /><stop offset="100%" stop-color="#1D4ED8" /></linearGradient>
    <linearGradient id="grad-session" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0D9488" /><stop offset="100%" stop-color="#0F766E" /></linearGradient>
    <linearGradient id="grad-tickets" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#059669" /><stop offset="100%" stop-color="#047857" /></linearGradient>
    <linearGradient id="grad-users" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7C3AED" /><stop offset="100%" stop-color="#6D28D9" /></linearGradient>
    <linearGradient id="grad-inventory" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D97706" /><stop offset="100%" stop-color="#B45309" /></linearGradient>
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.6" /></pattern>
  </defs>
  <rect width="1460" height="1040" fill="url(#bg-canvas)" rx="16" />
  <rect width="1460" height="1040" fill="url(#dot-grid)" rx="16" />
  
  <g id="header" transform="translate(40, 30)">
    <rect width="1380" height="74" rx="12" fill="url(#header-slate)" filter="url(#card-shadow)" />
    <text x="70" y="32" fill="#FFFFFF" font-size="20" font-weight="800" letter-spacing="0.5">DIAGRAMA DE CLASSES (UML)</text>
    <text x="70" y="54" fill="#94A3B8" font-size="13" font-weight="500">Completo com todas as Entidades, Associações e Cardinalidades (Multiplicidade)</text>
  </g>

  <!-- LINES AND CARDINALITIES -->
  <!-- Filme to Sessao -->
  <path d="M 210 390 L 210 430" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="215" y="405" fill="#475569" font-size="12" font-weight="700">1</text>
  <text x="215" y="420" fill="#475569" font-size="12" font-weight="700">0..*</text>

  <!-- Sala to Sessao -->
  <path d="M 420 500 L 360 500" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="400" y="490" fill="#475569" font-size="12" font-weight="700">1</text>
  <text x="370" y="490" fill="#475569" font-size="12" font-weight="700">0..*</text>

  <!-- Sala to Assento -->
  <path d="M 560 370 L 560 430" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="565" y="385" fill="#475569" font-size="12" font-weight="700">1</text>
  <text x="565" y="420" fill="#475569" font-size="12" font-weight="700">0..*</text>

  <!-- Sessao to Ingresso -->
  <path d="M 360 620 L 750 620" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="370" y="610" fill="#475569" font-size="12" font-weight="700">1</text>
  <text x="720" y="610" fill="#475569" font-size="12" font-weight="700">0..*</text>

  <!-- Assento to Ingresso -->
  <path d="M 700 500 L 750 500" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="705" y="490" fill="#475569" font-size="12" font-weight="700">1</text>
  <text x="725" y="490" fill="#475569" font-size="12" font-weight="700">0..1</text>

  <!-- Usuario to Ingresso -->
  <path d="M 1110 300 L 1080 300 L 1080 500 L 1060 500" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="1090" y="295" fill="#475569" font-size="12" font-weight="700">1</text>
  <text x="1065" y="495" fill="#475569" font-size="12" font-weight="700">0..*</text>

  <!-- Usuario to PedidoVenda -->
  <path d="M 1255 400 L 1255 430" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="1265" y="410" fill="#475569" font-size="12" font-weight="700">1</text>
  <text x="1265" y="425" fill="#475569" font-size="12" font-weight="700">0..*</text>

  <!-- Produto to Movimentacao -->
  <path d="M 1060 250 L 1080 250 L 1080 820 L 1060 820" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="1040" y="240" fill="#475569" font-size="12" font-weight="700">1</text>
  <text x="1040" y="810" fill="#475569" font-size="12" font-weight="700">0..*</text>


  <!-- Filme (Completo) -->
  <g class="card-transition" transform="translate(60, 140)">
    <rect width="300" height="250" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 288 0 Q 300 0 300 12 L 300 48 L 0 48 Z" fill="url(#grad-catalog)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">&lt;&lt;Entity&gt;&gt; Filme</text>
    <text x="16" y="70" fill="#0F172A" font-size="12" font-weight="500" class="mono">- id: Long</text>
    <text x="16" y="90" fill="#0F172A" font-size="12" font-weight="500" class="mono">- titulo: String</text>
    <text x="16" y="110" fill="#0F172A" font-size="12" font-weight="500" class="mono">- classificacaoEtaria: Integer</text>
    <text x="16" y="130" fill="#0F172A" font-size="12" font-weight="500" class="mono">- duracaoMinutos: Integer</text>
    <text x="16" y="150" fill="#0F172A" font-size="12" font-weight="500" class="mono">- sinopse: String</text>
    <line x1="0" y1="170" x2="300" y2="170" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="195" fill="#334155" font-size="12" font-weight="500" class="mono">+ getTitulo(): String</text>
    <text x="16" y="215" fill="#334155" font-size="12" font-weight="500" class="mono">+ setTitulo(String)</text>
  </g>

  <!-- Sessao (Completo) -->
  <g class="card-transition" transform="translate(60, 430)">
    <rect width="300" height="250" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 288 0 Q 300 0 300 12 L 300 48 L 0 48 Z" fill="url(#grad-session)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">&lt;&lt;Entity&gt;&gt; Sessao</text>
    <text x="16" y="70" fill="#0F172A" font-size="12" font-weight="500" class="mono">- id: Long</text>
    <text x="16" y="90" fill="#0F172A" font-size="12" font-weight="500" class="mono">- filme: Filme</text>
    <text x="16" y="110" fill="#0F172A" font-size="12" font-weight="500" class="mono">- sala: Sala</text>
    <text x="16" y="130" fill="#0F172A" font-size="12" font-weight="500" class="mono">- dataHoraInicio: LocalDateTime</text>
    <text x="16" y="150" fill="#0F172A" font-size="12" font-weight="500" class="mono">- dataHoraFim: LocalDateTime</text>
    <line x1="0" y1="170" x2="300" y2="170" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="195" fill="#334155" font-size="12" font-weight="500" class="mono">+ isDisponivel(): Boolean</text>
    <text x="16" y="215" fill="#334155" font-size="12" font-weight="500" class="mono">+ reservarAssento()</text>
  </g>

  <!-- Sala -->
  <g class="card-transition" transform="translate(420, 140)">
    <rect width="280" height="230" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 268 0 Q 280 0 280 12 L 280 48 L 0 48 Z" fill="url(#grad-catalog)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">&lt;&lt;Entity&gt;&gt; Sala</text>
    <text x="16" y="70" fill="#0F172A" font-size="12" font-weight="500" class="mono">- id: Long</text>
    <text x="16" y="90" fill="#0F172A" font-size="12" font-weight="500" class="mono">- nomeNumero: String</text>
    <text x="16" y="110" fill="#0F172A" font-size="12" font-weight="500" class="mono">- capacidadeTotal: Integer</text>
    <line x1="0" y1="130" x2="280" y2="130" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="155" fill="#334155" font-size="12" font-weight="500" class="mono">+ getCapacidade(): Integer</text>
    <text x="16" y="175" fill="#334155" font-size="12" font-weight="500" class="mono">+ adicionarAssento()</text>
  </g>

  <!-- Assento -->
  <g class="card-transition" transform="translate(420, 430)">
    <rect width="280" height="230" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 268 0 Q 280 0 280 12 L 280 48 L 0 48 Z" fill="url(#grad-session)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">&lt;&lt;Entity&gt;&gt; Assento</text>
    <text x="16" y="70" fill="#0F172A" font-size="12" font-weight="500" class="mono">- id: Long</text>
    <text x="16" y="90" fill="#0F172A" font-size="12" font-weight="500" class="mono">- sala: Sala</text>
    <text x="16" y="110" fill="#0F172A" font-size="12" font-weight="500" class="mono">- fileira: String</text>
    <text x="16" y="130" fill="#0F172A" font-size="12" font-weight="500" class="mono">- numero: Integer</text>
    <line x1="0" y1="150" x2="280" y2="150" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="175" fill="#334155" font-size="12" font-weight="500" class="mono">+ isOcupado(): Boolean</text>
  </g>
  
  <!-- Produto -->
  <g class="card-transition" transform="translate(750, 140)">
    <rect width="310" height="230" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 298 0 Q 310 0 310 12 L 310 48 L 0 48 Z" fill="url(#grad-inventory)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">&lt;&lt;Entity&gt;&gt; Produto</text>
    <text x="16" y="70" fill="#0F172A" font-size="12" font-weight="500" class="mono">- id: Long</text>
    <text x="16" y="90" fill="#0F172A" font-size="12" font-weight="500" class="mono">- nome: String</text>
    <text x="16" y="110" fill="#0F172A" font-size="12" font-weight="500" class="mono">- preco: BigDecimal</text>
    <text x="16" y="130" fill="#0F172A" font-size="12" font-weight="500" class="mono">- quantidadeEstoque: Integer</text>
    <line x1="0" y1="150" x2="310" y2="150" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="175" fill="#334155" font-size="12" font-weight="500" class="mono">+ atualizarEstoque()</text>
    <text x="16" y="195" fill="#334155" font-size="12" font-weight="500" class="mono">+ verificarDisponibilidade()</text>
  </g>

  <!-- Ingresso (NOVO) -->
  <g class="card-transition" transform="translate(750, 430)">
    <rect width="310" height="250" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 298 0 Q 310 0 310 12 L 310 48 L 0 48 Z" fill="url(#grad-tickets)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">&lt;&lt;Entity&gt;&gt; Ingresso</text>
    <text x="16" y="70" fill="#0F172A" font-size="12" font-weight="500" class="mono">- id: Long</text>
    <text x="16" y="90" fill="#0F172A" font-size="12" font-weight="500" class="mono">- sessao: Sessao</text>
    <text x="16" y="110" fill="#0F172A" font-size="12" font-weight="500" class="mono">- assento: Assento</text>
    <text x="16" y="130" fill="#0F172A" font-size="12" font-weight="500" class="mono">- usuario: Usuario</text>
    <text x="16" y="150" fill="#0F172A" font-size="12" font-weight="500" class="mono">- valor: BigDecimal</text>
    <text x="16" y="170" fill="#0F172A" font-size="12" font-weight="500" class="mono">- status: String</text>
    <line x1="0" y1="185" x2="310" y2="185" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="210" fill="#334155" font-size="12" font-weight="500" class="mono">+ emitirBilhete()</text>
    <text x="16" y="230" fill="#334155" font-size="12" font-weight="500" class="mono">+ cancelar()</text>
  </g>

  <!-- MovimentacaoEstoque (NOVO) -->
  <g class="card-transition" transform="translate(750, 720)">
    <rect width="310" height="230" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 298 0 Q 310 0 310 12 L 310 48 L 0 48 Z" fill="url(#grad-inventory)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">&lt;&lt;Entity&gt;&gt; MovimentacaoEstoque</text>
    <text x="16" y="70" fill="#0F172A" font-size="12" font-weight="500" class="mono">- id: Long</text>
    <text x="16" y="90" fill="#0F172A" font-size="12" font-weight="500" class="mono">- produto: Produto</text>
    <text x="16" y="110" fill="#0F172A" font-size="12" font-weight="500" class="mono">- tipo: String</text>
    <text x="16" y="130" fill="#0F172A" font-size="12" font-weight="500" class="mono">- quantidade: Integer</text>
    <text x="16" y="150" fill="#0F172A" font-size="12" font-weight="500" class="mono">- data: LocalDateTime</text>
    <line x1="0" y1="170" x2="310" y2="170" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="195" fill="#334155" font-size="12" font-weight="500" class="mono">+ registrarMovimentacao()</text>
  </g>

  <!-- Usuario -->
  <g class="card-transition" transform="translate(1110, 140)">
    <rect width="290" height="260" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 278 0 Q 290 0 290 12 L 290 48 L 0 48 Z" fill="url(#grad-users)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">&lt;&lt;Entity&gt;&gt; Usuario</text>
    <text x="16" y="70" fill="#0F172A" font-size="12" font-weight="500" class="mono">- id: Long</text>
    <text x="16" y="90" fill="#0F172A" font-size="12" font-weight="500" class="mono">- nome: String</text>
    <text x="16" y="110" fill="#0F172A" font-size="12" font-weight="500" class="mono">- email: String</text>
    <text x="16" y="130" fill="#0F172A" font-size="12" font-weight="500" class="mono">- senhaHash: String</text>
    <text x="16" y="150" fill="#0F172A" font-size="12" font-weight="500" class="mono">- perfil: String</text>
    <line x1="0" y1="180" x2="290" y2="180" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="205" fill="#334155" font-size="12" font-weight="500" class="mono">+ autenticar()</text>
    <text x="16" y="225" fill="#334155" font-size="12" font-weight="500" class="mono">+ atualizarPerfil()</text>
  </g>

  <!-- PedidoVenda (NOVO) -->
  <g class="card-transition" transform="translate(1110, 430)">
    <rect width="290" height="250" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 278 0 Q 290 0 290 12 L 290 48 L 0 48 Z" fill="url(#grad-tickets)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">&lt;&lt;Entity&gt;&gt; PedidoVenda</text>
    <text x="16" y="70" fill="#0F172A" font-size="12" font-weight="500" class="mono">- id: Long</text>
    <text x="16" y="90" fill="#0F172A" font-size="12" font-weight="500" class="mono">- usuario: Usuario</text>
    <text x="16" y="110" fill="#0F172A" font-size="12" font-weight="500" class="mono">- valorTotal: BigDecimal</text>
    <text x="16" y="130" fill="#0F172A" font-size="12" font-weight="500" class="mono">- formaPagamento: String</text>
    <text x="16" y="150" fill="#0F172A" font-size="12" font-weight="500" class="mono">- dataVenda: LocalDateTime</text>
    <line x1="0" y1="170" x2="290" y2="170" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="195" fill="#334155" font-size="12" font-weight="500" class="mono">+ calcularTotal()</text>
    <text x="16" y="215" fill="#334155" font-size="12" font-weight="500" class="mono">+ finalizarPedido()</text>
  </g>
</svg>
