  <text x="1130" y="765" fill="#475569" font-size="13" font-weight="700">(1,1)</text>

  <!-- Produto to Movimentacao (Horizontal Row 3) -->
  <line x1="340" y1="860" x2="550" y2="860" stroke="#64748B" stroke-width="2" />
  <g transform="translate(385, 830)">
    <polygon points="60,0 120,30 60,60 0,30" fill="url(#grad-rel-mer)" stroke="#F59E0B" stroke-width="2" filter="url(#pill-shadow)" />
    <text x="60" y="34" fill="#B45309" font-size="12" font-weight="800" text-anchor="middle">SOFRE</text>
  </g>
  <text x="350" y="850" fill="#475569" font-size="13" font-weight="700">(0,n)</text>
  <text x="510" y="850" fill="#475569" font-size="13" font-weight="700">(1,1)</text>


  <!-- ==================== ENTIDADES ==================== -->
  
  <!-- SALA (100, 140) -->
  <g class="card-transition" transform="translate(100, 140)">
    <rect width="240" height="160" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 228 0 Q 240 0 240 12 L 240 48 L 0 48 Z" fill="url(#header-slate)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">SALA</text>
    <text x="16" y="75" fill="#334155" font-size="12" font-weight="600" class="mono">(PK) id</text>
    <text x="16" y="100" fill="#334155" font-size="12" font-weight="600" class="mono">nome_numero</text>
    <text x="16" y="125" fill="#334155" font-size="12" font-weight="600" class="mono">capacidade_total</text>
  </g>

