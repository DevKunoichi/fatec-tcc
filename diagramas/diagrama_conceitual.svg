    <path d="M 0 12 Q 0 0 12 0 L 228 0 Q 240 0 240 12 L 240 48 L 0 48 Z" fill="url(#header-slate)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">FILME</text>
    <text x="16" y="75" fill="#334155" font-size="12" font-weight="600" class="mono">(PK) id</text>
    <text x="16" y="95" fill="#334155" font-size="12" font-weight="600" class="mono">titulo</text>
    <text x="16" y="115" fill="#334155" font-size="12" font-weight="600" class="mono">classificacao_etaria</text>
    <text x="16" y="135" fill="#334155" font-size="12" font-weight="600" class="mono">duracao</text>
  </g>

