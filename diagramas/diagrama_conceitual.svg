    <path d="M 0 12 Q 0 0 12 0 L 228 0 Q 240 0 240 12 L 240 48 L 0 48 Z" fill="url(#header-slate)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">SESSAO</text>
    <text x="16" y="75" fill="#334155" font-size="12" font-weight="600" class="mono">(PK) id</text>
