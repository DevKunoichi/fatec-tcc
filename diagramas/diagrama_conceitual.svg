    <rect width="240" height="160" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 228 0 Q 240 0 240 12 L 240 48 L 0 48 Z" fill="url(#header-slate)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">INGRESSO</text>
    <text x="16" y="75" fill="#334155" font-size="12" font-weight="600" class="mono">(PK) id</text>
    <text x="16" y="100" fill="#334155" font-size="12" font-weight="600" class="mono">valor</text>
    <text x="16" y="125" fill="#334155" font-size="12" font-weight="600" class="mono">status</text>
  </g>

  <!-- USUARIO (1000, 460) -->
  <g class="card-transition" transform="translate(1000, 460)">
    <rect width="240" height="160" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 228 0 Q 240 0 240 12 L 240 48 L 0 48 Z" fill="url(#header-slate)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">USUARIO</text>
    <text x="16" y="75" fill="#334155" font-size="12" font-weight="600" class="mono">(PK) id</text>
    <text x="16" y="95" fill="#334155" font-size="12" font-weight="600" class="mono">nome</text>
    <text x="16" y="115" fill="#334155" font-size="12" font-weight="600" class="mono">email</text>
    <text x="16" y="135" fill="#334155" font-size="12" font-weight="600" class="mono">perfil</text>
  </g>

  <!-- PRODUTO (100, 780) -->
  <g class="card-transition" transform="translate(100, 780)">
    <rect width="240" height="160" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 228 0 Q 240 0 240 12 L 240 48 L 0 48 Z" fill="url(#header-slate)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">PRODUTO</text>
    <text x="16" y="75" fill="#334155" font-size="12" font-weight="600" class="mono">(PK) id</text>
    <text x="16" y="100" fill="#334155" font-size="12" font-weight="600" class="mono">nome</text>
    <text x="16" y="125" fill="#334155" font-size="12" font-weight="600" class="mono">preco</text>
    <text x="16" y="150" fill="#334155" font-size="12" font-weight="600" class="mono">estoque</text>
  </g>

  <!-- MOVIMENTACAO (550, 780) -->
  <g class="card-transition" transform="translate(550, 780)">
    <rect width="240" height="160" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 228 0 Q 240 0 240 12 L 240 48 L 0 48 Z" fill="url(#header-slate)" />
    <text x="16" y="25" fill="#FFFFFF" font-size="14" font-weight="800">MOVIMENTACAO</text>
    <text x="16" y="75" fill="#334155" font-size="12" font-weight="600" class="mono">(PK) id</text>
    <text x="16" y="100" fill="#334155" font-size="12" font-weight="600" class="mono">tipo</text>
